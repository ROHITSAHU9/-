<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Friendship Day - 3D Animation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="stage">
        <button id="start-btn">▶ Start Friendship Day Wish</button>

        <div class="heart-container">
            <div id="heart" class="heart"></div>
        </div>

        <div id="panda" class="panda-container">
            <div class="panda-head">
                <div class="ear left"></div>
                <div class="ear right"></div>
                <div class="eye-patch left"></div>
                <div class="eye-patch right"></div>
            </div>
            <div class="panda-body"></div>
            <div class="bow">
                <div class="bow-string"></div>
            </div>
        </div>

        <div id="arrow" class="arrow"></div>

        <div id="envelope" class="envelope hidden">
            <div id="flap" class="envelope-flap"></div>
            <div class="tap-text">TAP TO OPEN ✉️</div>
        </div>

        <div id="card" class="card hidden">
            <h1>Happy Friendship Day! 💛</h1>
            <p>"A real friend is someone who walks in when the rest of the world walks out."</p>
            <p>Thank you for being such an awesome friend!</p>
            <div class="signature">Best Friends Forever ✨</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
