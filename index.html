<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Friendship Day! 💛</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0d0a1a, #200b2c, #05020a);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            color: #fff;
        }

        /* Ambient Glow in Background */
        .glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(255, 105, 180, 0.2), transparent 70%);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
        }

        /* Container */
        .container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Envelope Styles */
        .envelope-wrapper {
            position: relative;
            width: 300px;
            height: 200px;
            background-color: #d63384;
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 12px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .envelope-wrapper:hover {
            transform: translateY(-5px);
        }

        /* Envelope Flap Top */
        .envelope-flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 150px solid transparent;
            border-right: 150px solid transparent;
            border-top: 110px solid #ff4d94;
            transform-origin: top;
            transition: transform 0.6s ease 0.4s, z-index 0.2s 0.4s;
            z-index: 5;
        }

        /* Envelope Pocket Front */
        .envelope-pocket {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 150px solid #c2185b;
            border-right: 150px solid #c2185b;
            border-bottom: 100px solid #e91e63;
            border-top: 100px solid transparent;
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 12px;
            z-index: 4;
        }

        /* Heart Sticker on Envelope */
        .heart-seal {
            position: absolute;
            top: 90px;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 28px;
            z-index: 6;
            transition: opacity 0.4s ease 0.2s;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.2); }
        }

        /* Letter Inside Envelope */
        .letter {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 270px;
            height: 180px;
            background: linear-gradient(135deg, #ffffff, #fff0f5);
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 -5px 15px rgba(0, 0, 0, 0.2);
            z-index: 3;
            transition: transform 0.8s ease-in-out 0.6s, height 0.6s ease-in-out 1.2s;
            text-align: center;
            color: #333;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .letter h2 {
            font-size: 1.3rem;
            color: #d63384;
            margin-bottom: 8px;
            opacity: 0;
            transition: opacity 0.5s ease 1.5s;
        }

        .letter p {
            font-size: 0.85rem;
            color: #555;
            line-height: 1.4;
            opacity: 0;
            transition: opacity 0.5s ease 1.8s;
        }

        .letter .signature {
            margin-top: 10px;
            font-weight: bold;
            color: #ff2a5f;
            font-size: 0.9rem;
            opacity: 0;
            transition: opacity 0.5s ease 2s;
        }

        /* Instruction Text */
        .click-hint {
            margin-top: 30px;
            font-size: 1rem;
            letter-spacing: 1px;
            color: #ffb7c5;
            animation: fadeInOut 2s infinite;
            transition: opacity 0.5s;
        }

        @keyframes fadeInOut {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        /* Open State Animations */
        .envelope-wrapper.open .envelope-flap {
            transform: rotateX(180deg);
            z-index: 2;
        }

        .envelope-wrapper.open .heart-seal {
            opacity: 0;
        }

        .envelope-wrapper.open .letter {
            transform: translateX(-50%) translateY(-140px);
            height: 260px;
            z-index: 5;
        }

        .envelope-wrapper.open .letter h2,
        .envelope-wrapper.open .letter p,
        .envelope-wrapper.open .letter .signature {
            opacity: 1;
        }

        /* Falling Petals Background */
        .petal {
            position: fixed;
            top: -20px;
            background: radial-gradient(circle, #ff4d6d, #c9184a);
            border-radius: 15px 0 15px 0;
            opacity: 0.8;
            pointer-events: none;
            z-index: 20;
            animation: fall linear forwards;
        }

        @keyframes fall {
            0% {
                transform: translateY(0) rotate(0deg) scale(0.8);
                opacity: 1;
            }
            100% {
                transform: translateY(105vh) rotate(360deg) scale(1.2);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="glow"></div>

    <div class="container">
        <div class="envelope-wrapper" id="envelope">
            <div class="envelope-flap"></div>
            <div class="heart-seal">💖</div>
            <div class="envelope-pocket"></div>
            
            <div class="letter">
                <h2>Happy Friendship Day! ✨</h2>
                <p>सच्ची दोस्ती किस्मत से मिलती है,<br>और मेरी किस्मत में तुम जैसा दोस्त है!</p>
                <div class="signature">Thank you for being my friend! 💛</div>
            </div>
        </div>
        
        <div class="click-hint" id="hint">✉️ लिफाफे पर क्लिक करें...</div>
    </div>

    <script>
        const envelope = document.getElementById('envelope');
        const hint = document.getElementById('hint');
        let isOpen = false;

        envelope.addEventListener('click', () => {
            if (!isOpen) {
                envelope.classList.add('open');
                hint.style.opacity = '0';
                isOpen = true;

                // Start Petal Rain on Open
                setTimeout(() => {
                    startPetalRain();
                }, 500);
            }
        });

        // Function to create falling petals
        function startPetalRain() {
            setInterval(() => {
                const petal = document.createElement('div');
                petal.classList.add('petal');

                // Randomizing size, position, and duration
                const startX = Math.random() * window.innerWidth;
                const size = 10 + Math.random() * 15;
                const duration = 4 + Math.random() * 4;

                petal.style.left = `${startX}px`;
                petal.style.width = `${size}px`;
                petal.style.height = `${size * 1.3}px`;
                petal.style.animationDuration = `${duration}s`;

                document.body.appendChild(petal);

                // Cleanup petals after animation finishes
                setTimeout(() => {
                    petal.remove();
                }, duration * 1000);
            }, 150); // Generates a petal every 150ms
        }
    </script>
</body>
</html>
