<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Friendship Day 3D Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            background: radial-gradient(circle at center, #1a0b2e, #05010d);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Poppins', sans-serif;
            color: #fff;
            perspective: 1000px;
        }

        /* Scene Base */
        .scene {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            transform-style: preserve-3d;
        }

        /* 1. 3D Panda */
        .panda {
            position: absolute;
            left: -150px;
            bottom: 20%;
            width: 100px;
            height: 120px;
            z-index: 10;
            animation: pandaWalk 4s ease-in-out forwards;
        }

        /* Panda Body Shapes */
        .panda-body {
            position: absolute;
            width: 80px;
            height: 90px;
            background: #fff;
            border-radius: 50% 50% 45% 45%;
            bottom: 0;
            left: 10px;
            box-shadow: inset -10px -10px 20px rgba(0,0,0,0.3);
        }

        .panda-head {
            position: absolute;
            width: 70px;
            height: 60px;
            background: #fff;
            border-radius: 50%;
            top: -35px;
            left: 15px;
            box-shadow: inset -5px -5px 15px rgba(0,0,0,0.2);
        }

        .panda-ear {
            position: absolute;
            width: 22px;
            height: 22px;
            background: #222;
            border-radius: 50%;
            top: -10px;
        }

        .panda-ear.left { left: 5px; }
        .panda-ear.right { right: 5px; }

        .panda-eye {
            position: absolute;
            width: 16px;
            height: 22px;
            background: #222;
            border-radius: 50%;
            top: 20px;
        }

        .panda-eye.left { left: 12px; transform: rotate(15deg); }
        .panda-eye.right { right: 12px; transform: rotate(-15deg); }

        .panda-eye::after {
            content: '';
            position: absolute;
            width: 6px;
            height: 6px;
            background: #fff;
            border-radius: 50%;
            top: 6px;
            left: 5px;
        }

        /* 3D Bow */
        .bow {
            position: absolute;
            right: -25px;
            top: 30px;
            width: 10px;
            height: 60px;
            border-left: 5px solid #8b4513;
            border-radius: 50%;
            transform: rotate(-10deg);
        }

        .bow-string {
            position: absolute;
            width: 1px;
            height: 60px;
            background: #aaa;
            left: -5px;
            top: 0;
        }

        @keyframes pandaWalk {
            0% { left: -150px; }
            70% { left: 15%; }
            100% { left: 15%; }
        }

        /* 2. Arrow */
        .arrow {
            position: absolute;
            left: 18%;
            bottom: 27%;
            width: 60px;
            height: 4px;
            background: gold;
            opacity: 0;
            z-index: 9;
            box-shadow: 0 0 10px gold;
        }

        .arrow::after {
            content: '';
            position: absolute;
            right: 0;
            top: -4px;
            border-left: 10px solid gold;
            border-top: 6px solid transparent;
            border-bottom: 6px solid transparent;
        }

        .arrow.shoot {
            opacity: 1;
            animation: arrowFly 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        @keyframes arrowFly {
            0% { left: 18%; transform: scale(1); }
            100% { left: 50%; transform: scale(0.8) translate(-50%, -50%); }
        }

        /* 3. 3D Heart */
        .heart-container {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            width: 180px;
            height: 180px;
            z-index: 5;
        }

        .heart {
            position: relative;
            width: 100px;
            height: 90px;
            margin: 30px auto;
            animation: heartPulse 2s infinite ease-in-out;
        }

        .heart::before,
        .heart::after {
            position: absolute;
            content: "";
            left: 50px;
            top: 0;
            width: 50px;
            height: 80px;
            background: linear-gradient(135deg, #ff2a5f, #ff758c);
            border-radius: 50px 50px 0 0;
            transform: rotate(-45deg);
            transform-origin: 0 100%;
            box-shadow: 0 0 30px rgba(255, 42, 95, 0.8);
        }

        .heart::after {
            left: 0;
            transform: rotate(45deg);
            transform-origin: 100% 100%;
        }

        @keyframes heartPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        /* Hit Effect on Heart */
        .heart.hit {
            animation: heartHit 0.4s ease-out forwards;
        }

        @keyframes heartHit {
            0% { transform: scale(1); }
            50% { transform: scale(1.3) rotate(5deg); }
            100% { transform: scale(1); }
        }

        /* 4. 3D Letter / Envelope */
        .envelope {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            width: 220px;
            height: 140px;
            background: #ff4757;
            border-radius: 10px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            cursor: pointer;
            z-index: 20;
            opacity: 0;
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .envelope.popup {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .envelope-flap {
            position: absolute;
            top: 0;
            left: 0;
            border-left: 110px solid transparent;
            border-right: 110px solid transparent;
            border-top: 85px solid #ff6b81;
            transform-origin: top;
            transition: transform 0.5s ease;
        }

        .tap-btn {
            position: absolute;
            bottom: 15px;
            width: 100%;
            text-align: center;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 1px;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
            animation: blink 1.2s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        /* 5. Friendship Wishes Card */
        .card {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            width: 320px;
            background: rgba(255, 255, 255, 0.95);
            padding: 30px 20px;
            border-radius: 20px;
            text-align: center;
            color: #2f3542;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            z-index: 30;
            transition: transform 0.6s ease;
        }

        .card.open {
            transform: translate(-50%, -50%) scale(1);
        }

        .card h1 {
            color: #ff4757;
            font-size: 1.6rem;
            margin-bottom: 10px;
        }

        .card p {
            font-size: 0.95rem;
            line-height: 1.5;
            color: #57606f;
            margin-bottom: 15px;
        }

        .card .signature {
            font-weight: bold;
            color: #ff6b81;
        }

        /* Falling Petals */
        .petal {
            position: fixed;
            top: -10px;
            background: linear-gradient(#ff758c, #ff2a5f);
            border-radius: 15px 0 15px 0;
            pointer-events: none;
            z-index: 100;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to {
                transform: translateY(105vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="scene">
        <div class="panda" id="panda">
            <div class="panda-ear left"></div>
            <div class="panda-ear right"></div>
            <div class="panda-head">
                <div class="panda-eye left"></div>
                <div class="panda-eye right"></div>
            </div>
            <div class="panda-body"></div>
            <div class="bow">
                <div class="bow-string"></div>
            </div>
        </div>

        <div class="arrow" id="arrow"></div>

        <div class="heart-container">
            <div class="heart" id="heart"></div>
        </div>

        <div class="envelope" id="envelope">
            <div class="envelope-flap" id="flap"></div>
            <div class="tap-btn">TAP TO OPEN ✉️</div>
        </div>

        <div class="card" id="card">
            <h1>Happy Friendship Day! 💛</h1>
            <p>"A real friend is one who walks in when the rest of the world walks out."</p>
            <p>Thank you for being such an amazing friend!</p>
            <div class="signature">Best Friends Forever ✨</div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const arrow = document.getElementById("arrow");
            const heart = document.getElementById("heart");
            const envelope = document.getElementById("envelope");
            const flap = document.getElementById("flap");
            const card = document.getElementById("card");

            // Step 1: Panda arrives & shoots arrow
            setTimeout(() => {
                arrow.classList.add("shoot");
            }, 3800);

            // Step 2: Arrow hits Heart
            setTimeout(() => {
                heart.classList.add("hit");
            }, 4500);

            // Step 3: Envelope emerges from Heart
            setTimeout(() => {
                envelope.classList.add("popup");
            }, 5000);

            // Step 4: Tap Envelope to reveal English Wishes
            envelope.addEventListener("click", () => {
                flap.style.transform = "rotateX(180deg)";
                
                setTimeout(() => {
                    envelope.style.opacity = "0";
                    envelope.style.transform = "translate(-50%, -50%) scale(0)";
                    card.classList.add("open");
                    startPetalRain();
                }, 400);
            });

            // Step 5: Petal Rain Effect
            function startPetalRain() {
                setInterval(() => {
                    const petal = document.createElement("div");
                    petal.classList.add("petal");

                    const size = Math.random() * 12 + 8;
                    petal.style.width = `${size}px`;
                    petal.style.height = `${size * 1.3}px`;
                    petal.style.left = `${Math.random() * 100}vw`;
                    petal.style.animationDuration = `${Math.random() * 3 + 3}s`;

                    document.body.appendChild(petal);

                    setTimeout(() => petal.remove(), 6000);
                }, 150);
            }
        });
    </script>
</body>
</html>
